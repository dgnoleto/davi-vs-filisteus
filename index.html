<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davi vs Filisteus - Jogo de Física 2D</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- Phaser 3 Engine -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #1a1a2e 0%, #0f0f1b 100%);
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            font-size: 1.8rem;
            margin: 0 0 10px 0;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #ff7e5f, #feb47b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(255, 126, 95, 0.2);
        }

        #game-wrapper {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border-radius: 12px;
            overflow: hidden;
            border: 4px solid #2d2d44;
            background-color: #000;
            aspect-ratio: 16 / 9;
            width: 95vw;
            max-width: 960px;
        }

        #game-container {
            width: 100%;
            height: 100%;
        }

        .instructions {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #8b8b9f;
            text-align: center;
            max-width: 500px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>Davi vs Filisteus</h1>
    
    <div id="game-wrapper">
        <div id="game-container"></div>
    </div>

    <div class="instructions">
        Arraste a pedra no estilingue para mirar e solte para atirar. Derrote o Leão, o Urso e os Filisteus para proteger a tenda de Israel!
    </div>

    <!-- Script de inicialização usando ES Modules -->
    <script type="module" src="js/main.js"></script>

</body>
</html>
